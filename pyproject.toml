[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genro-sql"
version = "0.1.0"
description = "SQL model, PostgreSQL compiler and synchronous runtime"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Genropy Team"}
]
keywords = [
    "genro",
    "genropy",
    "sql",
    "ddl",
    "builder",
    "database",
    "schema"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "genro-builders>=0.27.0",
    "genro-bag>=0.27.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=1.0",
]
postgresql = [
    "psycopg[binary]>=3.3.6",
]
migration = [
    "genro-sqlmigration>=0.1.0",
]
dev = [
    "genro-sqlmigration[postgresql,validation]>=0.1.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=8.4",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/genropy/genro-sql"
Repository = "https://github.com/genropy/genro-sql"
Issues = "https://github.com/genropy/genro-sql/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/genro_sql"]

[tool.hatch.build.targets.wheel.force-include]
"docs/grammar.md" = "genro_sql/grammar.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=genro_sql --cov-report=term-missing"
markers = [
    "postgresql: integration test requiring a reachable PostgreSQL server",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

# Tolerant base, same policy as genro-builders: ruff is a net for REAL
# bugs only (undefined names, unused imports/vars, broken syntax). Rule
# families that rewrite or reorder code stay OFF by design.
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes - real bugs
]
ignore = [
    "E501",   # line too long
]

# Workflow contract tests are copied verbatim from the plan and are
# read-only: a binding kept for documentation value is not a defect here.
[tool.ruff.lint.per-file-ignores]
"tests/test_wf_phase*.py" = ["F841"]
".phased/**/test_wf_phase*.py" = ["F841"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/genro_sql"]
exclude = "/examples/"
