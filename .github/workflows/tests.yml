name: Tests

on:
  push:
    # PRs cover topic branches; release tags only run publish.yml.
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Only superseded revisions of the same PR cancel each other.
  # Main and manual runs each get an independent group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Minimal CI while asqueel evolves: asqueel builds SQL and passes parameters,
  # so the SQLite suite covers most of it; PostgreSQL runs only after it passes.
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GNR_TEST_PG_HOST: 127.0.0.1
      GNR_TEST_PG_PORT: '5432'
      GNR_TEST_PG_USER: postgres
      GNR_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - name: SQLite suite
        run: python -m pytest -q --no-cov -n auto --dist=loadfile -m "not postgresql" --ignore=tests/mysql --ignore=tests/adapter_mssql tests
      - name: PostgreSQL suite
        run: python -m pytest -q --no-cov -n auto --dist=loadfile -m postgresql --ignore=tests/mysql --ignore=tests/adapter_mssql tests
